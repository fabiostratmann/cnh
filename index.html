<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emissão de CNH ToscanI</title>
    <meta name="description"
        content="Gerador de CNH de brinquedo para crianças, com visual idêntico ao modelo oficial." />
    <style>
/* Premium styling for CNH Generator */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

:root {
  --primary-bg: #010133;
  --primary-color: #fff;
  --accent: #ffbf00;
  --shadow: rgba(0,0,0,0.2);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
}

body {
  background: linear-gradient(135deg, #e0eafc, #cfdef3);
  color: #333;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.site-header {
  background: var(--primary-bg);
  color: var(--primary-color);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  gap: 20px;
}

.site-header .logo {
  position: absolute;
  left: 20px;
  height: 60px;
  width: auto;
}

.site-header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.container {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  padding: 30px;
  justify-content: center;
}

.form-section, .preview-section {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  border-radius: 12px;
  box-shadow: 0 4px 12px var(--shadow);
  padding: 20px;
  flex: 1 1 350px;
  max-width: 500px;
}

.form-section h2, .preview-section h2 {
  margin-bottom: 15px;
  color: #010133;
  font-weight: 600;
}

form label {
  display: block;
  margin-top: 12px;
  font-weight: 600;
  color: #222;
}

form input[type="text"],
form input[type="date"],
form input[type="file"] {
  width: 100%;
  padding: 8px 12px;
  margin-top: 4px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 0.95rem;
  background: #fff;
  transition: border-color 0.3s;
}

form input:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  background: var(--primary-bg);
  color: var(--primary-color);
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
}

button:hover {
  background: #020260;
  transform: translateY(-2px);
}

button:disabled {
  background: #777;
  cursor: not-allowed;
}

canvas {
  max-width: 100%;
  border: 2px solid #010133;
  border-radius: 8px;
}

@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: stretch;
  }
}

</style>
</head>

        const canvas = document.getElementById('cnhCanvas');
        const ctx = canvas.getContext('2d');
        const gerarBtn = document.getElementById('gerarBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const previewStatus = document.getElementById('previewStatus');
        const fotoInput = document.getElementById('foto');
        let fotoImg = null;
        let templateLoaded = false;
        let generated = false;

        fotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (fotoImg && fotoImg.src.startsWith('blob:')) URL.revokeObjectURL(fotoImg.src);
            if (!file) { fotoImg = null; return; }
            const url = URL.createObjectURL(file);
            fotoImg = new Image();
            fotoImg.src = url;
        });

        templateImg.onload = () => {
            canvas.width = templateImg.width;
            canvas.height = templateImg.height;
            ctx.drawImage(templateImg, 0, 0);
            templateLoaded = true;
            previewStatus.textContent = 'Modelo carregado. Preencha os dados e clique em GERAR CNH.';
        };

        templateImg.onerror = () => {
            previewStatus.textContent = 'Não foi possível carregar o modelo da CNH. Baixe o arquivo index.html completo e abra-o em um navegador.';
        };

        gerarBtn.addEventListener('click', async () => {
            if (!templateLoaded) {
                previewStatus.textContent = 'Aguarde o carregamento do modelo antes de gerar a CNH.';
                return;
            }

            gerarBtn.disabled = true;
            downloadBtn.disabled = true;
            generated = false;
            previewStatus.textContent = 'Gerando a pré-visualização...';

            const logo = document.querySelector('.site-header .logo');
            try {
                await Promise.all([
                    waitForImage(templateImg),
                    waitForImage(logo),
                    ...(fotoImg ? [waitForImage(fotoImg)] : [])
                ]);
            } catch (error) {
                gerarBtn.disabled = false;
                previewStatus.textContent = 'Não foi possível carregar uma das imagens. Selecione outra foto e tente novamente.';
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(templateImg, 0, 0);

            const nome = document.getElementById('nome').value.trim();
            const docId = document.getElementById('docId').value.trim();
            const emissor = document.getElementById('emissor').value.trim();
            const nascimento = document.getElementById('nascimento').value;
            const cpf = document.getElementById('cpf').value.trim();
            const filiacao = document.getElementById('filiacao').value.trim();
            const categoria = document.getElementById('categoria').value.trim();
            const registro = document.getElementById('registro').value.trim();
            const validade = document.getElementById('validade').value;
            const local = document.getElementById('local').value.trim();
            const dataEmissao = document.getElementById('dataEmissao').value;

            // Aumentando um pouco a fonte
            const fontSize = Math.max(12, Math.floor(canvas.height * 0.018));
            ctx.fillStyle = '#000';
            ctx.font = 'bold ' + fontSize + 'px Arial';

            const W = canvas.width;
            const H = canvas.height;

            // Ajustando a altura (Y) para empurrar o texto para baixo (saindo de cima dos rótulos)
            if (nome) ctx.fillText(nome, W * 0.170, H * 0.140);

            const docStr = docId + (emissor ? ' / ' + emissor : '');
            if (docStr) ctx.fillText(docStr, W * 0.510, H * 0.190);

            if (cpf) ctx.fillText(cpf, W * 0.510, H * 0.245);

            let nascStr = nascimento;
            if (nascimento && nascimento.includes('-')) {
                const [y, m, d] = nascimento.split('-');
                nascStr = `${d}/${m}/${y}`;
            }
            if (nascStr) ctx.fillText(nascStr, W * 0.755, H * 0.245);

            if (filiacao) ctx.fillText(filiacao, W * 0.510, H * 0.310);
            if (categoria) ctx.fillText(categoria, W * 0.860, H * 0.420);
            if (registro) ctx.fillText(registro, W * 0.170, H * 0.470);

            let valStr = validade;
            if (validade && validade.includes('-')) {
                const [y, m, d] = validade.split('-');
                valStr = `${d}/${m}/${y}`;
            }
            if (valStr) ctx.fillText(valStr, W * 0.490, H * 0.470);

            // Observações
            ctx.fillText('DOCUMENTO EMITIDO POR TOSCANI MOTORS', W * 0.170, H * 0.550);

            // Local and Data de Emissão
            if (local) ctx.fillText(local, W * 0.170, H * 0.825);
            let dataEmiStr = dataEmissao;
            if (dataEmissao && dataEmissao.includes('-')) {
                const [y, m, d] = dataEmissao.split('-');
                dataEmiStr = `${d}/${m}/${y}`;
            }
            if (dataEmiStr) ctx.fillText(dataEmiStr, W * 0.755, H * 0.825);

            // Desenha o logo dentro do campo observações, à direita
            ctx.drawImage(logo, W * 0.750, H * 0.490, W * 0.150, W * 0.150 * (logo.height / logo.width));

            if (fotoImg) {
                const boxX = W * 0.162;
                const boxY = H * 0.260;
                const boxW = W * 0.338;
                const boxH = H * 0.165;

                const imgRatio = fotoImg.width / fotoImg.height;
                const boxRatio = boxW / boxH;

                let drawW = boxW;
                let drawH = boxH;

                if (imgRatio > boxRatio) {
                    drawH = boxW / imgRatio;
                } else {
                    drawW = boxH * imgRatio;
                }

                const drawX = boxX + (boxW - drawW) / 2;
                const drawY = boxY + (boxH - drawH) / 2;

                ctx.drawImage(fotoImg, drawX, drawY, drawW, drawH);
            }

            gerarBtn.disabled = false;
            downloadBtn.disabled = false;
            generated = true;
            previewStatus.textContent = 'Pré-visualização pronta para download.';
        });

        function waitForImage(image) {
            if (image.complete) {
                return image.naturalWidth > 0 ? Promise.resolve() : Promise.reject(new Error('A imagem não pôde ser carregada.'));
            }
            return new Promise((resolve, reject) => {
                image.addEventListener('load', resolve, { once: true });
                image.addEventListener('error', reject, { once: true });
            });
        }

        downloadBtn.addEventListener('click', () => {
            if (!generated) return;
            previewStatus.textContent = 'Preparando o download...';
            canvas.toBlob((blob) => {
                if (!blob) {
                    previewStatus.textContent = 'Não foi possível criar o arquivo PNG. Gere a CNH novamente e tente outra vez.';
                    return;
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'cnh_gerada.png';
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                previewStatus.textContent = 'Download iniciado.';
            }, 'image/png');
        });
    </script>
